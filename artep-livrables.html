<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#24364D;--copper:#C4620A;--petrol:#1F4D4F;--text:#1F2937;--panel:#F6F8FB;--border:#E5E7EB;--muted:#6B7280}
body{font-family:'Montserrat','Inter',system-ui,sans-serif;background:var(--panel);color:var(--text);min-height:100vh}

.header{background:var(--blue);border-bottom:3px solid var(--copper);padding:16px 24px}
.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;max-width:1000px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand-text{border-left:1px solid rgba(255,255,255,.2);padding-left:14px}
.brand-text .title{color:#fff;font-weight:700;font-size:13px;letter-spacing:.05em}
.brand-text .sub{color:rgba(255,255,255,.5);font-size:11px;margin-top:2px}

.main{max-width:1000px;margin:0 auto;padding:24px 20px}

.section-title{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:32px 0 12px;padding-left:2px}

.card{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none;gap:12px}
.card-header:hover{background:#F9FAFB}
.card-left{display:flex;align-items:center;gap:10px}
.card-icon{font-size:18px;flex-shrink:0}
.card-title{font-weight:700;font-size:13px;color:var(--blue)}
.card-desc{font-size:11px;color:var(--muted);margin-top:2px}
.card-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-copy{background:var(--copper);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:Montserrat,sans-serif;white-space:nowrap;transition:background .15s}
.btn-copy:hover{background:#a35008}
.btn-copy.copied{background:var(--petrol)}
.chevron{color:var(--muted);font-size:12px;transition:transform .2s;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}

.card-body{display:none;padding:0 16px 16px}
.card-body.open{display:block}
.content-box{background:#F6F8FB;border:1px solid var(--border);border-radius:8px;padding:16px;font-family:'DM Mono',monospace;font-size:12px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word}
</style>
</head>

function buildUI() {
  const main = document.getElementById("main");
  const cats = ["Prompts","Architecture","Canva"];
  cats.forEach(cat => {
    const items = LIVRABLES.filter(l => l.cat === cat);
    const sec = document.createElement("div");
    sec.innerHTML = `<div class="section-title">${cat}</div>`;
    items.forEach((l, i) => {
      const id = cat + i;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-header" onclick="toggle('${id}')">
          <div class="card-left">
            <div class="card-icon">${l.icon}</div>
            <div>
              <div class="card-title">${l.title}</div>
              <div class="card-desc">${l.desc}</div>
            </div>
          </div>
          <div class="card-actions">
            <button class="btn-copy" id="btn-${id}" onclick="event.stopPropagation();copyText('${id}')">📋 Copier</button>
            <span class="chevron" id="chev-${id}">▼</span>
          </div>
        </div>
        <div class="card-body" id="body-${id}">
          <div class="content-box" id="content-${id}">${escHtml(l.content)}</div>
        </div>`;
      card.querySelector(`#content-${id}`).dataset.raw = l.content;
      sec.appendChild(card);
    });
    main.appendChild(sec);
  });
}

function escHtml(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function toggle(id){
  const body = document.getElementById("body-"+id);
  const chev = document.getElementById("chev-"+id);
  body.classList.toggle("open");
  chev.classList.toggle("open");
}

function copyText(id){
  const content = document.getElementById("content-"+id).dataset.raw;
  navigator.clipboard.writeText(content).then(()=>{
    const btn = document.getElementById("btn-"+id);
    btn.textContent = "✓ Copié !";
    btn.classList.add("copied");
    setTimeout(()=>{btn.textContent="📋 Copier";btn.classList.remove("copied");},2000);
  });
}

buildUI();
