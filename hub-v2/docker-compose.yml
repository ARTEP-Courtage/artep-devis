# Hub IA V2 — orchestration locale et préproduction.
# En production, Coolify gère le déploiement à partir de ce fichier.
services:
  hub:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Les valeurs réelles viennent des variables chiffrées Coolify.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AIRTABLE_API_KEY=${AIRTABLE_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sante')"]
      interval: 30s
      timeout: 5s
      retries: 3
