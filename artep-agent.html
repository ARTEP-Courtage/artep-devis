<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTEP — Agent de coordination Phase 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@300;400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:   #24364D;
  --blue2:  #6F8FB5;
  --copper: #C4620A;
  --petrol: #1F4D4F;
  --text:   #1F2937;
  --bg:     #FFFFFF;
  --panel:  #F6F8FB;
  --border: #E5E7EB;
  --muted:  #6B7280;
}

body {
  font-family: 'Montserrat', 'Inter', system-ui, sans-serif;
  background: var(--panel);
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  background: var(--blue);
  border-bottom: 3px solid var(--copper);
  padding: 16px 24px;
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  max-width: 1200px;
  margin: 0 auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-text {
  border-left: 1px solid rgba(255,255,255,0.2);
  padding-left: 14px;
}
.brand-text .title { color: #fff; font-weight: 700; font-size: 13px; letter-spacing: 0.05em; }
.brand-text .sub   { color: rgba(255,255,255,0.5); font-size: 11px; margin-top: 2px; }

.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-box {
  background: rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 6px 14px;
  text-align: center;
  min-width: 70px;
}
.stat-box .val { font-weight: 700; font-size: 20px; }
.stat-box .lbl { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.4); }

/* ── LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 1fr;
  max-width: 1200px;
  margin: 0 auto;
}
.layout.with-panel {
  grid-template-columns: 1fr 1fr;
}

/* ── TASK LIST ── */
.tasklist { padding: 20px; }

.btn-run-all {
  width: 100%;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 16px;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 0.15s;
}
.btn-run-all:hover { background: var(--copper); }
.btn-run-all:disabled { background: var(--muted); cursor: default; }

.alert-review {
  background: #FEF3E8;
  border: 1px solid var(--copper);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 16px;
  font-size: 12px;
  color: var(--copper);
  font-weight: 600;
  display: none;
}

.cat-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  padding-left: 2px;
}

.cat-group { margin-bottom: 24px; }
.tasks { display: flex; flex-direction: column; gap: 8px; }

.task-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  cursor: default;
  transition: border-color 0.15s;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.task-card.clickable { cursor: pointer; }
.task-card.clickable:hover { border-color: var(--blue2); }
.task-card.selected { border-color: var(--blue); background: #EEF3F8; }

.task-left { display: flex; align-items: flex-start; gap: 10px; }
.task-icon { font-size: 20px; flex-shrink: 0; }
.task-title { font-weight: 700; font-size: 13px; color: var(--blue); margin-bottom: 3px; }
.task-desc  { font-size: 11px; color: var(--muted); }

.task-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}

.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
}

.btn-generate {
  background: var(--copper);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  letter-spacing: 0.04em;
  transition: background 0.12s;
}
.btn-generate:hover { background: #a35008; }

.btn-regen {
  background: var(--blue2);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
}

/* Progress */
.progress-box {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 8px;
}
.progress-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 11px;
}
.progress-header .prog-label { font-weight: 700; color: var(--blue); }
.progress-header .prog-count { color: var(--muted); }
.progress-bar-bg {
  background: var(--border);
  border-radius: 999px;
  height: 6px;
}
.progress-bar-fill {
  background: var(--petrol);
  border-radius: 999px;
  height: 6px;
  transition: width 0.4s;
}

/* ── REVIEW PANEL ── */
.review-panel {
  border-left: 1px solid var(--border);
  background: #fff;
  padding: 20px;
  display: none;
  flex-direction: column;
  min-height: 500px;
}
.review-panel.visible { display: flex; }

.review-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.review-sublabel {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.review-title { font-weight: 700; font-size: 14px; color: var(--blue); }
.btn-close {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
}

.review-textarea {
  flex: 1;
  width: 100%;
  min-height: 320px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  resize: vertical;
  outline: none;
}
.review-textarea:focus { border-color: var(--blue2); }

.review-actions {
  margin-top: 14px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.btn-approve {
  flex: 1;
  background: var(--petrol);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  transition: background 0.12s;
}
.btn-approve:hover { background: #163535; }
.btn-copy {
  flex: 1;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  transition: background 0.12s;
}
.btn-copy:hover { background: var(--copper); }
.btn-reject {
  background: #FEF2F2;
  color: #DC2626;
  border: 1px solid #FECACA;
  border-radius: 10px;
  padding: 11px 14px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
}
.review-hint {
  margin-top: 10px;
  font-size: 10px;
  color: var(--muted);
  text-align: center;
}

/* Spinner */
.spinner {
  display: inline-block;
  width: 12px; height: 12px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="brand">
      <!-- Logo ARTEP SVG inline (fond clair → cls-1 = #24364D) -->
      <svg viewBox="0 0 450 116" width="130" style="display:block;flex-shrink:0">

      <div class="brand-text">
        <div class="title">Agent de coordination</div>

      </div>
    </div>
    <div class="stats">
      <div class="stat-box">
        <div class="val" id="count-pending" style="color:#9CA3AF">0</div>

      <div class="stat-box">
        <div class="val" id="count-review" style="color:#C4620A">0</div>
        <div class="lbl">À valider</div>
      </div>
      <div class="stat-box">
        <div class="val" id="count-approved" style="color:#6EE7B7">0</div>
        <div class="lbl">Validés</div>
      </div>
    </div>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout" id="layout">
  <div class="tasklist">
    <button class="btn-run-all" id="btn-run-all" onclick="runAll()">
      ▶ Générer tous les livrables
    </button>
    <div class="alert-review" id="alert-review"></div>

    <!-- PROMPTS -->
    <div class="cat-group">
      <div class="cat-label">Prompts</div>
      <div class="tasks" id="cat-Prompts"></div>
    </div>
    <!-- ARCHITECTURE -->
    <div class="cat-group">
      <div class="cat-label">Architecture</div>
      <div class="tasks" id="cat-Architecture"></div>
    </div>
    <!-- CANVA -->
    <div class="cat-group">
      <div class="cat-label">Canva</div>
      <div class="tasks" id="cat-Canva"></div>
    </div>

    <!-- PROGRESS -->
    <div class="progress-box">
      <div class="progress-header">
        <span class="prog-label">Progression Phase 1</span>
        <span class="prog-count" id="prog-count">0 / 12 livrables</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="prog-bar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- REVIEW PANEL -->
  <div class="review-panel" id="review-panel">
    <div class="review-header">
      <div>
        <div class="review-sublabel">Validation requise</div>
        <div class="review-title" id="review-title"></div>
      </div>
      <button class="btn-close" onclick="closePanel()">✕</button>
    </div>
    <textarea class="review-textarea" id="review-textarea" placeholder="Contenu généré..."></textarea>
    <div class="review-actions">
      <button class="btn-approve" onclick="approveSelected()">✓ Valider</button>
      <button class="btn-copy"    onclick="copySelected()">📋 Copier</button>
      <button class="btn-reject"  onclick="rejectSelected()">✕ Refuser</button>
    </div>
    <div class="review-hint">Tu peux modifier le texte avant de valider</div>
  </div>
</div>

<script>
// ── TASKS DATA ──────────────────────────────────────────────────────────────
const TASKS = [
  { id:"t1", category:"Prompts", icon:"💬", title:"Prompt P0 — Classification commentaire", desc:"Génère le prompt de classification commentaire simple / sensible pour Make.",
    prompt:`Tu es un expert en automatisation Instagram pour une entreprise de courtage en travaux en Île-de-France. Génère le prompt opérationnel P0 de classification des commentaires Instagram pour ARTEP Courtage Travaux. Ce prompt sera injecté dans Make dans un module HTTP/IA. Il doit retourner un JSON strict avec : classification (simple|sensible), motif, action, extrait_sensible. Critères sensibles : prix, devis, litige, délai, juridique, mécontentement. En cas de doute → sensible. Fournis le texte du prompt prêt à copier dans Make, avec la variable {{commentaire}}.` },

  { id:"t2", category:"Prompts", icon:"📷", title:"Prompt P1 — Classification photo chantier", desc:"Génère le prompt de classification visuelle des photos pour Make.",
    prompt:`Tu es un expert en automatisation Instagram pour ARTEP Courtage Travaux, courtier en travaux en Île-de-France. Génère le prompt opérationnel P1 de classification visuelle des photos de chantier. Le prompt sera injecté dans Make dans un module de vision IA. Il doit analyser une image et retourner un JSON strict avec : categorie (avant_apres|realisation|cuisine|salle_de_bains|extension|appartement|maison|commerce|non_classifiable), type_contenu, qualite_publication (publiable|non_publiable), confiance (0-100), raison_non_publiable, ville_detectee. Règle : si confiance < 80 → non_publiable.` },

  { id:"t3", category:"Prompts", icon:"✍️", title:"Prompt P2 — Génération légende Instagram", desc:"Génère le prompt de rédaction des légendes Instagram ARTEP.",
    prompt:`Tu es un expert en content marketing pour ARTEP Courtage Travaux, courtier en travaux en Île-de-France. Génère le prompt opérationnel P2 de génération de légende Instagram. Interdictions absolues : suivi de chantier, maîtrise d'œuvre, coordination des entreprises, pilotage de chantier, direction de travaux. Formulations autorisées : courtage en travaux, mise en relation, accompagnement projet, aide à la comparaison, sélection d'entreprises, conseil avant travaux. Style : sobre, humain, professionnel, 3-5 lignes max. Structure : accroche + description + hashtags (8-12). Variables Make : {{categorie}}, {{type_contenu}}, {{ville_detectee}}.` },

  { id:"t4", category:"Prompts", icon:"🧠", title:"Prompt P3 — Humanisation ARTEP", desc:"Génère le prompt d'humanisation du texte généré par IA.",
    prompt:`Tu es un expert en rédaction naturelle pour ARTEP Courtage Travaux. Génère le prompt opérationnel P3 d'humanisation des textes générés par IA. Objectif : supprimer tout marqueur IA (phrases trop lisses, transitions artificielles, emphase). Règles : varier longueur des phrases, supprimer de plus/en outre/ainsi, conserver le sens exact, ne pas allonger, ne pas ajouter d'informations, conserver les hashtags. Interdictions absolues maintenues : suivi de chantier, maîtrise d'œuvre, coordination des entreprises. Variable Make : {{texte_genere}}.` },

  { id:"t5", category:"Prompts", icon:"⚖️", title:"Prompt P4 — Contrôle juridique", desc:"Génère le prompt de contrôle juridique ARTEP automatique.",
    prompt:`Tu es un expert juridique pour ARTEP Courtage Travaux, courtier en travaux. Génère le prompt opérationnel P4 de contrôle juridique automatique. Termes interdits à détecter : suivi de chantier, maîtrise d'œuvre, coordination des entreprises, pilotage de chantier, direction de travaux, dirige les travaux, supervise les travaux, contrôle les travaux. Retourne un JSON strict : statut (valide|bloque), termes_detectes (liste ou []), action (publier_brouillon|bloquer_et_alerter). Si bloqué : pas de brouillon, alerte immédiate. Variable Make : {{texte_a_controler}}.` },

  { id:"t6", category:"Prompts", icon:"↩️", title:"Prompt P5 — Réponse commentaire Niveau 1", desc:"Génère le prompt de réponse aux commentaires simples Instagram.",
    prompt:`Tu es le community manager d'ARTEP Courtage Travaux. Génère le prompt opérationnel P5 de réponse aux commentaires Instagram simples (compliments, félicitations, questions génériques). Règles : une seule phrase, ton sobre et humain, pas de commercial, pas de prix ni de délai, pas de promesse, pas d'emojis sauf si présents dans le commentaire d'origine, pas de formule creuse. Interdictions absolues maintenues. Variable Make : {{commentaire}}.` },

  { id:"t7", category:"Prompts", icon:"🗺️", title:"Prompt P6 — Adaptation Google Business", desc:"Génère le prompt d'adaptation des posts Instagram pour Google Business.",
    prompt:`Tu es le rédacteur Google Business d'ARTEP Courtage Travaux. Génère le prompt opérationnel P6 d'adaptation d'une légende Instagram validée pour Google Business. Différences : pas de hashtags, ton sobre et local, orienté SEO local IDF, max 3 phrases, ancrage géographique obligatoire. Structure : description sobre + ancrage local (ville/département/IDF) + appel à l'action sobre. Interdictions absolues maintenues. Variables Make : {{legende_instagram_validee}}, {{ville_detectee}}.` },

  { id:"t8", category:"Architecture", icon:"📁", title:"Brief technique OneDrive", desc:"Génère l'arborescence OneDrive complète à créer avant de brancher Make.",
    prompt:`Tu es un expert en automatisation Make pour une entreprise de courtage en travaux. Génère le brief technique complet de l'arborescence OneDrive à créer pour ARTEP Courtage Travaux Phase 1. Couvrir : photos chantier (avant/après, réalisations par catégorie : cuisine, salle de bains, extension, appartement, maison, commerce), avis clients, articles à traiter. Inclure les noms de dossiers exacts à utiliser dans Make comme déclencheurs Watch Files. Format : liste hiérarchique claire, noms en français, prête à créer dans OneDrive Business.` },

  { id:"t9", category:"Architecture", icon:"⚙️", title:"Blueprint Make — Workflow photo", desc:"Génère le blueprint détaillé du workflow photo → Instagram pour Make.",
    prompt:`Tu es un expert Make (ex-Integromat) pour ARTEP Courtage Travaux, courtier en travaux en IDF. Génère le blueprint détaillé module par module du Workflow 1 : OneDrive Watch Files → Download → Vision IA (P1 classification) → Router → IA génération texte (P2) → IA humanisation (P3) → contrôle juridique (P4) → Canva Create Design → Canva Export → Metricool Create Draft → Email notification validation. Pour chaque module : nom exact dans Make, champs à renseigner, connexions OAuth nécessaires, variables transmises entre modules. Règle absolue : aucune publication sans validation humaine.` },

  { id:"t10", category:"Architecture", icon:"💬", title:"Blueprint Make — Workflow commentaires", desc:"Génère le blueprint des workflows commentaires Instagram (Niveau 1 + 2).",
    prompt:`Tu es un expert Make pour ARTEP Courtage Travaux. Génère le blueprint Make détaillé des Workflows 4 et 5 : gestion commentaires Instagram. Workflow 4 (simples) : Instagram Watch Comments → P0 classification → si simple → P5 réponse → P4 contrôle juridique → notification Sylvain → Instagram Reply après validation. Workflow 5 (sensibles) : Instagram Watch Comments → P0 classification → si sensible → alerte email + mobile Sylvain → ajout tableau OneDrive suivi → aucune réponse automatique. Pour chaque workflow : modules Make exacts, champs, variables, logique de routage.` },

  { id:"t11", category:"Canva", icon:"🎨", title:"Brief Canva — Template Avant/Après", desc:"Génère les spécifications techniques pour créer le template carrousel dans Canva Pro.",
    prompt:`Tu es directeur artistique expert Canva Pro pour ARTEP Courtage Travaux. Charte officielle : Bleu principal #24364D, Cuivre #C4620A, Vert pétrole #1F4D4F, Blanc #FFFFFF, Fond neutre #F6F8FB. Typographie : Montserrat Bold/SemiBold pour titres, Inter Regular pour corps. Police de marque : Neometric (base de conception). Aucun dégradé, aplats uniquement. Génère les spécifications techniques complètes pour créer dans Canva Pro le Template 1 Avant/Après en carrousel 3 slides. Pour chaque slide : fond, disposition exacte, couleurs HEX, typographies avec tailles, positions des éléments, champs modifiables vs verrouillés, logo ARTEP position fixe. Format 1080x1080px.` },

  { id:"t12", category:"Canva", icon:"🎨", title:"Brief Canva — Templates Réalisation, Avis, Conseil", desc:"Génère les spécifications pour les 3 templates restants.",
    prompt:`Tu es directeur artistique expert Canva Pro pour ARTEP Courtage Travaux. Charte : #24364D (bleu), #C4620A (cuivre), #1F4D4F (pétrole), #FFFFFF, #F6F8FB. Montserrat + Inter. Neometric comme base de conception. Aucun dégradé, aplats uniquement. Génère les spécifications techniques Canva Pro complètes pour 3 templates distincts : Template 2 Réalisation (photo plein cadre + bande texte inférieure), Template 3 Avis Client (fond clair, guillemets cuivre, étoiles notation), Template 4 Conseil Travaux (fond bleu foncé #24364D, titre cuivre, 3 points structurés). Pour chaque template : disposition, couleurs HEX, typographies, champs modifiables, éléments verrouillés, logo ARTEP. Format 1080x1080px.` },
];

// ── STATE ───────────────────────────────────────────────────────────────────
const state = {};
TASKS.forEach(t => state[t.id] = { status: "pending", output: "" });
let selectedId = null;
let isRunningAll = false;

// ── CLAUDE API ──────────────────────────────────────────────────────────────
async function callClaude(prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: "Tu es l'agent de coordination IA pour ARTEP Courtage Travaux, courtier en travaux en Île-de-France. Tu génères des livrables opérationnels précis, sans introduction ni conclusion. Réponds directement avec le contenu demandé, prêt à être utilisé ou copié.",
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await res.json();
  return data.content?.map(b => b.text || "").join("") || "Erreur API — vérifier la connexion.";
}

// ── RENDER ──────────────────────────────────────────────────────────────────
const STATUS_CFG = {
  pending:  { label: "En attente",  color: "#6B7280", bg: "#F3F4F6" },
  running:  { label: "Génération…", color: "#24364D", bg: "#EEF3F8" },
  review:   { label: "À valider",   color: "#C4620A", bg: "#FEF3E8" },
  approved: { label: "Validé ✓",   color: "#1F4D4F", bg: "#E8F2F2" },
  rejected: { label: "Refusé",     color: "#DC2626", bg: "#FEF2F2" },
};

function render() {
  const counts = { pending:0, running:0, review:0, approved:0, rejected:0 };
  Object.values(state).forEach(s => counts[s.status]++);

  document.getElementById("count-pending").textContent  = counts.pending;
  document.getElementById("count-review").textContent   = counts.review;
  document.getElementById("count-approved").textContent = counts.approved;
  document.getElementById("prog-count").textContent     = `${counts.approved} / ${TASKS.length} livrables`;
  document.getElementById("prog-bar").style.width       = `${(counts.approved / TASKS.length) * 100}%`;

  const alertEl = document.getElementById("alert-review");
  if (counts.review > 0) {
    alertEl.style.display = "block";
    alertEl.textContent = `⚠ ${counts.review} livrable${counts.review > 1 ? "s" : ""} en attente de ta validation`;
  } else {
    alertEl.style.display = "none";
  }

  const btnAll = document.getElementById("btn-run-all");
  if (counts.pending === 0) {
    btnAll.style.display = "none";
  } else {
    btnAll.style.display = "flex";
    btnAll.disabled = isRunningAll;
    btnAll.innerHTML = isRunningAll
      ? `<span class="spinner"></span> Génération en cours… (${counts.pending} restants)`
      : `▶ Générer tous les livrables (${counts.pending} en attente)`;
  }

  ["Prompts", "Architecture", "Canva"].forEach(cat => {
    const container = document.getElementById(`cat-${cat}`);
    container.innerHTML = "";
    TASKS.filter(t => t.category === cat).forEach(task => {
      const s = state[task.id];
      const cfg = STATUS_CFG[s.status];
      const clickable = s.status === "review" || s.status === "approved";
      const isSelected = selectedId === task.id;

      const card = document.createElement("div");
      card.className = `task-card${clickable ? " clickable" : ""}${isSelected ? " selected" : ""}`;
      if (clickable) card.onclick = () => openPanel(task.id);

      card.innerHTML = `
        <div class="task-left">
          <div class="task-icon">${task.icon}</div>
          <div>
            <div class="task-title">${task.title}</div>
            <div class="task-desc">${task.desc}</div>
          </div>
        </div>
        <div class="task-right">
          <span class="badge" style="color:${cfg.color};background:${cfg.bg}">${cfg.label}</span>
          ${s.status === "pending"  ? `<button class="btn-generate" onclick="event.stopPropagation();runTask('${task.id}')">Générer</button>` : ""}
          ${s.status === "rejected" ? `<button class="btn-regen"    onclick="event.stopPropagation();runTask('${task.id}')">Regénérer</button>` : ""}
        </div>
      `;
      container.appendChild(card);
    });
  });

  // Panel
  const layout = document.getElementById("layout");
  const panel  = document.getElementById("review-panel");
  if (selectedId) {
    layout.classList.add("with-panel");
    panel.classList.add("visible");
    const task = TASKS.find(t => t.id === selectedId);
    document.getElementById("review-title").textContent = `${task.icon} ${task.title}`;
    document.getElementById("review-textarea").value = state[selectedId].output;
  } else {
    layout.classList.remove("with-panel");
    panel.classList.remove("visible");
  }
}

// ── ACTIONS ─────────────────────────────────────────────────────────────────
async function runTask(id) {
  if (state[id].status === "running") return;
  state[id].status = "running";
  state[id].output = "";
  render();
  const task = TASKS.find(t => t.id === id);
  try {
    state[id].output = await callClaude(task.prompt);
    state[id].status = "review";
    selectedId = id;
  } catch(e) {
    state[id].output = "Erreur lors de la génération. Réessayez.";
    state[id].status = "review";
  }
  render();
}

async function runAll() {
  isRunningAll = true;
  render();
  for (const task of TASKS) {
    if (state[task.id].status === "pending") { await runTask(task.id); saveState(); }
  }
  isRunningAll = false;
  render();
}

function openPanel(id) {
  selectedId = id;
  render();
}

function closePanel() {
  selectedId = null;
  render();
}

function approveSelected() {
  if (!selectedId) return;
  state[selectedId].output = document.getElementById("review-textarea").value;
  state[selectedId].status = "approved";
  selectedId = null;
  render();
}

function rejectSelected() {
  if (!selectedId) return;
  state[selectedId].status = "rejected";
  selectedId = null;
  render();
}

function copySelected() {
  const text = document.getElementById("review-textarea").value;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector(".btn-copy");
    btn.textContent = "✓ Copié !";
    setTimeout(() => btn.textContent = "📋 Copier", 2000);
  });
}

// ── LOCALSTORAGE PERSISTENCE ─────────────────────────────────────────────────
const STORAGE_KEY = "artep_agent_v1";

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.keys(parsed).forEach(id => {
        if (state[id] !== undefined) {
          state[id] = parsed[id];
          // Si une tâche était "running" lors de la fermeture, la repasser en pending
          if (state[id].status === "running") state[id].status = "pending";
        }
      });
    }
  } catch(e) {}
}

// Patch toutes les actions pour sauvegarder après chaque changement
const _runTask = runTask;
runTask = async function(id) {
  await _runTask(id);
  saveState();
};

const _approveSelected = approveSelected;
approveSelected = function() {
  _approveSelected();
  saveState();
};

const _rejectSelected = rejectSelected;
rejectSelected = function() {
  _rejectSelected();
  saveState();
};

// Bouton reset
document.querySelector(".progress-box").insertAdjacentHTML("afterend", `
  <div style="margin-top:12px;text-align:center">
    <button onclick="resetAll()" style="background:none;border:1px solid #E5E7EB;border-radius:8px;
      padding:6px 14px;font-size:10px;color:#6B7280;cursor:pointer;font-family:Montserrat,sans-serif;">
      🔄 Réinitialiser l'agent
    </button>
  </div>
`);

function resetAll() {
  if (!confirm("Réinitialiser tous les livrables ? Cette action est irréversible.")) return;
  TASKS.forEach(t => { state[t.id] = { status: "pending", output: "" }; });
  selectedId = null;
  localStorage.removeItem(STORAGE_KEY);
  render();
}

// ── INIT ─────────────────────────────────────────────────────────────────────
loadState();
render();
</script>
</body>
</html>
