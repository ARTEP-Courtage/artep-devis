<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#24364D;--blue2:#6F8FB5;--copper:#C4620A;--petrol:#1F4D4F;--text:#1F2937;--panel:#F6F8FB;--border:#E5E7EB;--muted:#6B7280}
body{font-family:'Montserrat','Inter',system-ui,sans-serif;background:var(--panel);color:var(--text);min-height:100vh}
.header{background:var(--blue);border-bottom:3px solid var(--copper);padding:16px 24px}
.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand-text .title{color:#fff;font-weight:700;font-size:13px;letter-spacing:.05em}
.brand-text .sub{color:rgba(255,255,255,.5);font-size:11px;margin-top:2px}
.brand-text{border-left:1px solid rgba(255,255,255,.2);padding-left:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat-box{background:rgba(255,255,255,.08);border-radius:8px;padding:6px 14px;text-align:center;min-width:70px}
.stat-box .val{font-weight:700;font-size:20px}
.stat-box .lbl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.layout{display:grid;grid-template-columns:1fr;max-width:1200px;margin:0 auto}
.layout.with-panel{grid-template-columns:1fr 1fr}
.tasklist{padding:20px}
.cat-label{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-left:2px}
.cat-group{margin-bottom:24px}
.tasks{display:flex;flex-direction:column;gap:8px}
.task-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;cursor:default;transition:border-color .15s}
.task-card.clickable{cursor:pointer}
.task-card.clickable:hover{border-color:var(--blue2)}
.task-card.selected{border-color:var(--blue);background:#EEF3F8}
.task-left{display:flex;align-items:flex-start;gap:10px}
.task-icon{font-size:20px;flex-shrink:0}
.task-title{font-weight:700;font-size:13px;color:var(--blue);margin-bottom:3px}
.task-desc{font-size:11px;color:var(--muted)}
.task-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.progress-box{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:8px}
.progress-header{display:flex;justify-content:space-between;margin-bottom:8px;font-size:11px}
.prog-label{font-weight:700;color:var(--blue)}
.prog-count{color:var(--muted)}
.progress-bar-bg{background:var(--border);border-radius:999px;height:6px}
.progress-bar-fill{background:var(--petrol);border-radius:999px;height:6px;transition:width .4s}
.reset-btn{margin-top:12px;text-align:center}
.reset-btn button{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:10px;color:var(--muted);cursor:pointer;font-family:Montserrat,sans-serif}
.review-panel{border-left:1px solid var(--border);background:#fff;padding:20px;display:none;flex-direction:column;min-height:500px}
.review-panel.visible{display:flex}
.review-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.review-sublabel{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.review-title{font-weight:700;font-size:14px;color:var(--blue)}
.btn-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.review-textarea{flex:1;width:100%;min-height:320px;border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;line-height:1.7;color:var(--text);font-family:'DM Mono',monospace;resize:vertical;outline:none}
.review-textarea:focus{border-color:var(--blue2)}
.review-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.btn-approve{flex:1;background:var(--petrol);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:Montserrat,sans-serif}
.btn-copy{flex:1;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:Montserrat,sans-serif}
.btn-reject{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;border-radius:10px;padding:11px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:Montserrat,sans-serif}
.review-hint{margin-top:10px;font-size:10px;color:var(--muted);text-align:center}
.info-banner{background:#EEF3F8;border:1px solid var(--blue2);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--blue);font-weight:600}
</style>
</head>

const TASKS = [
{id:"t1",category:"Prompts",icon:"💬",title:"Prompt P0 — Classification commentaire",desc:"Classification commentaire simple / sensible pour Make.",
content:`PROMPT P0 — CLASSIFICATION COMMENTAIRE INSTAGRAM
À injecter dans Make > module HTTP/IA

Tu es un classificateur de commentaires Instagram pour ARTEP Courtage Travaux, entreprise de courtage en travaux en Île-de-France.

Commentaire reçu : {{commentaire}}

Analyse ce commentaire et retourne UNIQUEMENT un objet JSON :

{
  "classification": "[simple | sensible]",
  "motif": "[compliment | question_generique | devis | prix | delai | litige | critique | juridique | garantie | null]",
  "action": "[traiter_automatiquement | alerter_sylvain]",
  "extrait_sensible": "[mot ou phrase déclencheur, sinon null]"
}

CRITÈRES SIMPLES :
- compliment (bravo, magnifique, beau travail, félicitations)
- question générique non engageante (vous intervenez où, vous faites quoi)

CRITÈRES SENSIBLES — ALERTE IMMÉDIATE si présence de :
- prix, combien, tarif, devis, budget, coût, €
- délai, durée, quand, planning, retard
- problème, litige, malfaçon, garantie, assurance
- responsabilité, juridique, avocat, tribunal
- arnaque, volé, escroquerie, plainte
- pas content, déçu, honte, scandaleux

Règle absolue : en cas de doute → sensible.
Retourner uniquement le JSON, sans texte avant ni après.`},

{id:"t2",category:"Prompts",icon:"📷",title:"Prompt P1 — Classification photo chantier",desc:"Classification visuelle des photos pour Make.",
content:`PROMPT P1 — CLASSIFICATION PHOTO CHANTIER
À injecter dans Make > module vision IA

Tu es un assistant de classification visuelle pour ARTEP Courtage Travaux, entreprise de courtage en travaux en Île-de-France.

Analyse l'image fournie et retourne UNIQUEMENT un objet JSON :

{
  "categorie": "[avant_apres | realisation | cuisine | salle_de_bains | extension | appartement | maison | commerce | non_classifiable]",
  "type_contenu": "[avant | apres | realisation_seule]",
  "qualite_publication": "[publiable | non_publiable]",
  "confiance": [0 à 100],
  "raison_non_publiable": "[flou | trop_sombre | chantier_en_cours | non_pertinent | null]",
  "ville_detectee": "[ville si visible sur l'image, sinon null]"
}

Règle : si confiance < 80 → qualite_publication = non_publiable.
Retourner uniquement le JSON, sans texte avant ni après.`},

{id:"t3",category:"Prompts",icon:"✍️",title:"Prompt P2 — Génération légende Instagram",desc:"Rédaction des légendes Instagram ARTEP.",
content:`PROMPT P2 — GÉNÉRATION LÉGENDE INSTAGRAM ARTEP
À injecter dans Make > module génération texte

Tu es le rédacteur Instagram d'ARTEP Courtage Travaux, entreprise de courtage en travaux en Île-de-France.

Contexte de la photo :
- Catégorie : {{categorie}}
- Type : {{type_contenu}}
- Ville : {{ville_detectee}}

Rédige une légende Instagram en respectant ces règles :

STYLE :
- 3 à 5 lignes maximum
- Ton sobre, humain, professionnel
- Pas d'emphase excessive, pas de superlatifs
- Pas de point d'exclamation répété
- Écriture naturelle, comme un professionnel qui parle à un particulier

STRUCTURE :
- Ligne 1 : accroche courte sur la transformation ou le projet
- Lignes 2-3 : description sobre du projet
- Ligne 4 : hashtags (8 à 12 maximum)

HASHTAGS OBLIGATOIRES :
#artepcourtage #courtagetravaux #rénovationIDF #travaux{{ville_detectee}} #rénovationappartement

INTERDICTIONS ABSOLUES :
Ne jamais utiliser : suivi de chantier, maîtrise d'œuvre, coordination des entreprises, pilotage de chantier, direction de travaux.

FORMULATIONS AUTORISÉES UNIQUEMENT :
courtage en travaux, mise en relation, accompagnement projet, aide à la comparaison, sélection d'entreprises, conseil avant travaux.

Retourne uniquement la légende, sans commentaire.`},

{id:"t4",category:"Prompts",icon:"🧠",title:"Prompt P3 — Humanisation ARTEP",desc:"Humanisation du texte généré par IA.",
content:`PROMPT P3 — HUMANISATION ARTEP
À injecter dans Make > module réécriture

Tu es un correcteur stylistique pour ARTEP Courtage Travaux.

Voici un texte généré automatiquement :
{{texte_genere}}

Réécris ce texte en respectant ces règles :

OBJECTIF :
Supprimer tout marqueur de rédaction IA. Le texte doit sembler écrit par un professionnel humain.

RÈGLES :
- Varier la longueur des phrases
- Supprimer les formules trop lisses ou trop parfaites
- Supprimer les transitions artificielles (de plus, en outre, ainsi, etc.)
- Conserver le sens exact
- Conserver les hashtags tels quels
- Ne pas ajouter d'informations absentes du texte original
- Ne pas modifier les formulations juridiques validées
- Ne pas allonger le texte
- Ne pas ajouter de promesses ou d'engagements

INTERDICTIONS ABSOLUES :
Ne jamais utiliser : suivi de chantier, maîtrise d'œuvre, coordination des entreprises, pilotage de chantier, direction de travaux.

Retourne uniquement le texte réécrit, sans commentaire.`},

{id:"t5",category:"Prompts",icon:"⚖️",title:"Prompt P4 — Contrôle juridique",desc:"Contrôle juridique automatique ARTEP.",
content:`PROMPT P4 — CONTRÔLE JURIDIQUE ARTEP

Tu es un contrôleur juridique pour ARTEP Courtage Travaux, entreprise de courtage en travaux.

}

Si statut = bloque :
- ne pas transmettre le texte

Retourner uniquement le JSON, sans texte avant ni après.`},

{id:"t6",category:"Prompts",icon:"↩️",title:"Prompt P5 — Réponse commentaire Niveau 1",desc:"Réponse aux commentaires simples Instagram.",
content:`PROMPT P5 — RÉPONSE COMMENTAIRE NIVEAU 1

content:`PROMPT P6 — ADAPTATION GOOGLE BUSINESS

{id:"t9",category:"Architecture",icon:"⚙️",title:"Blueprint Make — Workflow photo",desc:"Blueprint détaillé workflow photo → Instagram.",
content:`BLUEPRINT MAKE — WORKFLOW 1 : PHOTO → INSTAGRAM
Module par module

DÉCLENCHEUR :
OneDrive > Watch Files
- Dossier : /01_ARTEP_RESEAUX_SOCIAUX/07_Photos_Avant_Apres/paire-*/
- Surveiller : nouveaux fichiers uniquement
- Fréquence : toutes les 15 minutes

MODULE 1 — OneDrive > Watch Files
Champs : Connection OneDrive, chemin dossier, nombre max fichiers = 2

MODULE 2 — OneDrive > Download File
Champs : ID fichier (depuis module 1), format binaire

MODULE 3 — HTTP > Make an API Call (Vision IA)
URL : API OpenAI Vision ou Claude API
Body : image en base64 + prompt P1 classification
Sortie : JSON {categorie, type_contenu, qualite_publication, confiance, ville_detectee}

MODULE 4 — Tools > Set Variable
Vérification confiance < 80 ou qualite_publication = non_publiable
→ Si oui : brancher vers Module 4B (alerte)
→ Si non : continuer vers Module 5

MODULE 4B — Email > Send Email (ALERTE)

const STORAGE_KEY = "artep_agent_v2";
const STATUS_CFG = {
  review:   {label:"À valider",  color:"#C4620A", bg:"#FEF3E8"},
  approved: {label:"Validé ✓",  color:"#1F4D4F", bg:"#E8F2F2"},
  rejected: {label:"À revoir",  color:"#DC2626", bg:"#FEF2F2"},
};

// État
const state = {};
TASKS.forEach(t => state[t.id] = {status:"review", output:t.content});
let selectedId = null;

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.keys(parsed).forEach(id => { if(state[id]) state[id] = parsed[id]; });
    }
  } catch(e){}
}

function render() {
  const counts = {review:0, approved:0, rejected:0};
  Object.values(state).forEach(s => { if(counts[s.status]!==undefined) counts[s.status]++; });

  document.getElementById("count-pending").textContent = 0;
  document.getElementById("count-review").textContent = counts.review;
  document.getElementById("count-approved").textContent = counts.approved;
  document.getElementById("prog-count").textContent = counts.approved + " / " + TASKS.length;
  document.getElementById("prog-bar").style.width = (counts.approved / TASKS.length * 100) + "%";

  ["Prompts","Architecture","Canva"].forEach(cat => {
    const container = document.getElementById("cat-" + cat);
    container.innerHTML = "";
    TASKS.filter(t => t.category === cat).forEach(task => {
      const s = state[task.id];
      const cfg = STATUS_CFG[s.status];
      const isSelected = selectedId === task.id;
      const card = document.createElement("div");
      card.className = "task-card clickable" + (isSelected ? " selected" : "");
      card.onclick = () => openPanel(task.id);
      card.innerHTML = `
        <div class="task-left">
          <div class="task-icon">${task.icon}</div>
          <div>
            <div class="task-title">${task.title}</div>
            <div class="task-desc">${task.desc}</div>
          </div>
        </div>
        <div class="task-right">
          <span class="badge" style="color:${cfg.color};background:${cfg.bg}">${cfg.label}</span>
        </div>`;
      container.appendChild(card);
    });
  });

  const layout = document.getElementById("layout");
  const panel = document.getElementById("review-panel");
  if (selectedId) {
    layout.classList.add("with-panel");
    panel.classList.add("visible");
    const task = TASKS.find(t => t.id === selectedId);
    document.getElementById("review-title").textContent = task.icon + " " + task.title;
    const ta = document.getElementById("review-textarea");
    if (ta.dataset.taskId !== selectedId) {
      ta.value = state[selectedId].output;
      ta.dataset.taskId = selectedId;
    }
  } else {
    layout.classList.remove("with-panel");
    panel.classList.remove("visible");
  }
}

function openPanel(id) { selectedId = id; render(); }
function closePanel() { selectedId = null; render(); }

function approveSelected() {
  if (!selectedId) return;
  state[selectedId].output = document.getElementById("review-textarea").value;
  state[selectedId].status = "approved";
  const idx = TASKS.findIndex(t => t.id === selectedId);
  const next = TASKS[idx + 1];
  selectedId = next ? next.id : null;
  saveState(); render();
}

function rejectSelected() {
  if (!selectedId) return;
  state[selectedId].status = "rejected";
  saveState(); render();
}

function copySelected() {
  const text = document.getElementById("review-textarea").value;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector(".btn-copy");
    btn.textContent = "✓ Copié !";
    setTimeout(() => btn.textContent = "📋 Copier", 2000);
  });
}

function resetAll() {
  if (!confirm("Réinitialiser toutes les validations ?")) return;
  TASKS.forEach(t => state[t.id] = {status:"review", output:t.content});
  selectedId = null;
  localStorage.removeItem(STORAGE_KEY);
  render();
}

loadState();
render();
</script>
